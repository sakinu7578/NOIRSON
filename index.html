<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NOIRSON — curated music for the quiet hours.">
    <title>NOIRSON | Curated Music Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Slab:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-v2">
    <header class="site-header">
        <a class="logo" href="index.html" aria-label="NOIRSON 首頁"><img src="images/Logo.png" alt="NOIRSON"></a>
        <nav class="main-nav" aria-label="主要導覽">
            <a href="index.html" aria-current="page">HOME</a>
            <a href="music.html">EXPLORE</a>
            <a href="about.html">ABOUT</a>
            <a href="login.html">LOGIN</a>
        </nav>
    </header>

    <main>
        <section class="signature-mix" aria-labelledby="signature-title">
            <div class="signature-visual">
                <img id="signature-cover" src="images/00.png" alt="Somewhere far from everyone 音樂封面">
                <div class="signature-visual-shade" aria-hidden="true"></div>
                <div class="signature-content">
                    <p class="signature-kicker">NOIRSON SIGNATURE MIX · M001</p>
                    <div class="signature-heading">
                        <div>
                            <p id="signature-series" class="section-label">MAIN ALBUM / CHILL VIBE</p>
                            <h1 id="signature-title">Somewhere far from everyone</h1>
                        </div>
                        <button class="signature-play" type="button" aria-label="播放 Somewhere far from everyone" aria-pressed="false">
                            <span class="play-icon" aria-hidden="true"></span>
                        </button>
                    </div>
                    <div class="signature-player">
                        <span class="player-time" id="current-time">00:00</span>
                        <label class="visually-hidden" for="player-progress">音樂播放進度</label>
                        <input id="player-progress" class="signature-progress" type="range" min="0" max="100" value="0" step="0.1">
                        <span class="player-time" id="total-time">00:00</span>
                    </div>
                    <audio id="signature-audio" preload="metadata"></audio>
                </div>
            </div>
        </section>

        <section class="explore-sound" aria-labelledby="explore-sound-title">
            <div class="explore-sound-header">
                <div>
                    <p class="section-label">CURATED FOR THE QUIET HOURS</p>
                    <h2 id="explore-sound-title">EXPLORE SOUND</h2>
                </div>
                <a class="explore-all-link" href="music.html">View all mix <span aria-hidden="true">→</span></a>
            </div>
            <div class="explore-carousel" aria-label="精選 Mix 輪播">
                <button class="explore-arrow explore-arrow--previous" type="button" aria-label="向左瀏覽 Mix"><span aria-hidden="true">←</span></button>
                <div class="explore-viewport"><div class="explore-track"></div></div>
                <button class="explore-arrow explore-arrow--next" type="button" aria-label="向右瀏覽 Mix"><span aria-hidden="true">→</span></button>
            </div>
        </section>
    </main>

    <footer class="site-footer site-footer--v2">
        <nav class="social-links" aria-label="社群連結">
            <a href="https://www.youtube.com/@NOIRSON/featured" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
            <a href="https://open.spotify.com/artist/2AEwxDNnN3ItPROEBoiIdD?si=mYXE1ziWRpimqdb7zkumOw" target="_blank" rel="noopener noreferrer">SPOTIFY</a>
            <a href="https://www.instagram.com/noirson_0?utm_source=ig_web_button_share_sheet&amp;stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
        </nav>
        <div class="footer-meta"><span>Produced by NOIRSON</span><span>© NOIRSON</span></div>
    </footer>

    <script src="js/mix-data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
