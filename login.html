<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NOIRSON</title>

</head>
<body class="auth-v2">
    <header class="site-header">
        <a class="logo" href="index.html" aria-label="NOIRSON 首頁"><img src="images/Logo.png" alt="NOIRSON"></a>
        <nav class="main-nav" aria-label="主要導覽">
            <a href="index.html" data-i18n="nav.home">HOME</a>
            <a href="music.html" data-i18n="nav.explore">EXPLORE</a>
            <a href="about.html" data-i18n="nav.about">ABOUT</a>
            <a href="login.html" aria-current="page" data-i18n="nav.login">LOGIN</a>
            <span class="language-switch" aria-label="Language"><button class="language-option" type="button" data-language="zh" aria-pressed="true">繁中</button><span aria-hidden="true">/</span><button class="language-option" type="button" data-language="en" aria-pressed="false">EN</button></span>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-visual" aria-labelledby="auth-brand-title">
            <div class="auth-background" aria-hidden="true">
                <div class="auth-background-layer is-active"></div>
                <div class="auth-background-layer"></div>
                <div class="auth-background-shade"></div>
            </div>
            <div class="auth-visual-copy">
                <p class="section-label" data-i18n="auth.members">NOIRSON MEMBERS</p>
                <h1 id="auth-brand-title" data-i18n-html="auth.loginBrand">MUSIC FOR YOUR<br>LATE NIGHT MOOD</h1>
                <p data-i18n="auth.loginIntro">Discover and collect sounds for the quiet hours.</p>
            </div>
        </section>

        <section class="auth-panel" aria-labelledby="login-title">
            <div class="auth-panel-inner">
                <p class="section-label" data-i18n="auth.access">MEMBER ACCESS</p>
                <h2 id="login-title" data-i18n="auth.login">LOGIN</h2>
                <form class="auth-form" action="#">
                    <div class="auth-field">
                        <label for="login-email" data-i18n="auth.email">EMAIL</label>
                        <input id="login-email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="auth-field">
                        <label for="login-password" data-i18n="auth.password">PASSWORD</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="auth-submit" type="submit" data-i18n="auth.login">LOGIN</button>
                </form>
                <p class="auth-switch"><span data-i18n="auth.new">NEW TO NOIRSON?</span> <a href="register.html" data-i18n="auth.register">REGISTER</a></p>
            </div>
        </section>
    </main>
