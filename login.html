<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NOIRSON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Slab:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-v2">
    <header class="site-header">
        <a class="logo" href="index.html" aria-label="NOIRSON 首頁"><img src="images/Logo.png" alt="NOIRSON"></a>
        <nav class="main-nav" aria-label="主要導覽">
            <a href="index.html">HOME</a>
            <a href="music.html">EXPLORE</a>
            <a href="about.html">ABOUT</a>
            <a href="login.html" aria-current="page">LOGIN</a>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-visual" aria-labelledby="auth-brand-title">
            <div class="auth-background" aria-hidden="true">
                <div class="auth-background-layer is-active"></div>
                <div class="auth-background-layer"></div>
                <div class="auth-background-shade"></div>
            </div>
            <div class="auth-visual-copy">
                <p class="section-label">NOIRSON MEMBERS</p>
                <h1 id="auth-brand-title">MUSIC FOR YOUR<br>LATE NIGHT MOOD</h1>
                <p>Discover and collect sounds for the quiet hours.</p>
            </div>
        </section>

        <section class="auth-panel" aria-labelledby="login-title">
            <div class="auth-panel-inner">
                <p class="section-label">MEMBER ACCESS</p>
                <h2 id="login-title">LOGIN</h2>
                <form class="auth-form" action="#">
                    <div class="auth-field">
                        <label for="login-email">EMAIL</label>
                        <input id="login-email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="auth-field">
                        <label for="login-password">PASSWORD</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="auth-submit" type="submit">LOGIN</button>
                </form>
                <p class="auth-switch">NEW TO NOIRSON? <a href="register.html">REGISTER</a></p>
            </div>
        </section>
    </main>

    <footer class="site-footer site-footer--v2">
        <nav class="social-links" aria-label="社群連結">
            <a href="https://www.youtube.com/@NOIRSON/featured" target="_blank" rel="noopener noreferrer">YOUTUBE</a>
            <a href="https://open.spotify.com/artist/2AEwxDNnN3ItPROEBoiIdD?si=mYXE1ziWRpimqdb7zkumOw" target="_blank" rel="noopener noreferrer">SPOTIFY</a>
            <a href="https://www.instagram.com/noirson_0?utm_source=ig_web_button_share_sheet&amp;stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
        </nav>
        <div class="footer-meta"><span>Produced by NOIRSON</span><span>© NOIRSON</span></div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
