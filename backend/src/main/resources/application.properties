# Spring Boot 應用程式名稱
spring.application.name=NOIRSON

# MySQL 資料庫連線
spring.datasource.url=jdbc:mysql://localhost:3306/noirson

# 啟用本機設定 application-local.properties
spring.profiles.active=local

# 啟動時只驗證既有資料表與 Entity，不由 Hibernate 修改 schema。
spring.jpa.hibernate.ddl-auto=validate

# Session Cookie：本機 HTTP 可用；HTTPS 部署時由容器依安全連線加上 Secure。
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# 開發環境來源；部署時須以實際 HTTPS 前端來源覆蓋此清單。
noirson.csrf.allowed-origins=http://localhost:5173,http://localhost:8080
