# Spring Boot 應用程式名稱
spring.application.name=NOIRSON

# MySQL 資料庫連線
spring.datasource.url=jdbc:mysql://localhost:3306/noirson
spring.datasource.username=root

# 啟用本機設定 application-local.properties
spring.profiles.active=local

# 讓 Hibernate 根據 Entity 更新資料表結構
spring.jpa.hibernate.ddl-auto=update

# Session Cookie：本機 HTTP 可用；HTTPS 部署時由容器依安全連線加上 Secure。
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
