<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix Detail | NOIRSON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Slab:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="detail-v2">
    <header class="site-header">
        <a class="logo" href="index.html" aria-label="NOIRSON 首頁"><img src="images/Logo.png" alt="NOIRSON"></a>
        <nav class="main-nav" aria-label="主要導覽">
            <a href="index.html" data-i18n="nav.home">HOME</a>
            <a href="music.html" aria-current="page" data-i18n="nav.explore">EXPLORE</a>
            <a href="about.html" data-i18n="nav.about">ABOUT</a>
            <a href="login.html" data-i18n="nav.login">LOGIN</a>
            <span class="language-switch" aria-label="Language"><button class="language-option" type="button" data-language="zh" aria-pressed="true">繁中</button><span aria-hidden="true">/</span><button class="language-option" type="button" data-language="en" aria-pressed="false">EN</button></span>
        </nav>
    </header>

    <main class="music-detail-page">
        <section class="music-detail-hero" aria-labelledby="music-detail-title">
            <div class="music-detail-media">
                <div class="music-detail-visual">
                    <div class="detail-main-visual-layer is-active">
                        <img id="detail-main-visual" src="images/00.png" alt="">
                    </div>
                    <div class="detail-main-visual-layer" aria-hidden="true">
                        <img src="images/00.png" alt="">
                    </div>
                </div>
                <section class="detail-gallery-section" aria-labelledby="detail-gallery-title">
                    <div class="detail-gallery-heading">
                        <p class="section-label" data-i18n="detail.visuals">VISUALS</p>
                        <div class="detail-gallery-title-row">
                            <h2 id="detail-gallery-title" data-i18n="detail.fromMix">FROM THIS MIX</h2>
                            <button class="detail-gallery-auto" type="button" aria-label="開啟 Visuals 自動輪播" aria-pressed="false" title="自動輪播">
                                <span class="detail-gallery-auto-icon" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>
                    <div class="detail-gallery-controls">
                        <button class="detail-gallery-arrow detail-gallery-previous" type="button" aria-label="向左瀏覽 Gallery">←</button>
                        <div class="detail-gallery"></div>
                        <button class="detail-gallery-arrow detail-gallery-next" type="button" aria-label="向右瀏覽 Gallery">→</button>
                    </div>
                </section>
            </div>

            <div class="music-detail-info">
                <p class="music-detail-eyebrow"><span id="detail-mix-id">M001</span><span id="detail-series">MAIN ALBUM / CHILL VIBE</span></p>
                <h1 id="music-detail-title">Somewhere far from everyone</h1>

                <div class="detail-player" aria-label="Mix 播放器">
                    <div class="detail-player-controls">
                        <button class="detail-skip detail-previous" type="button" aria-label="上一首 Mix"><span aria-hidden="true">←</span></button>
                        <button class="signature-play detail-play" type="button" aria-label="播放" aria-pressed="false">
                            <span class="play-icon" aria-hidden="true"></span>
                        </button>
                        <button class="detail-skip detail-next" type="button" aria-label="下一首 Mix"><span aria-hidden="true">→</span></button>
                    </div>
                    <div class="detail-player-timeline">
                        <label class="visually-hidden" for="detail-progress">音樂播放進度</label>
                        <input id="detail-progress" class="signature-progress" type="range" min="0" max="100" value="0" step="0.1">
                        <div class="detail-player-times">
                            <span id="detail-current-time">00:00</span>
                            <span id="detail-total-time">00:00</span>
                        </div>
                    </div>
                    <button class="detail-playlist-toggle" type="button" aria-label="開啟播放清單" aria-expanded="false">
                        <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
                    </button>
                    <div class="detail-player-secondary" aria-label="播放模式與音量控制">
                        <button class="detail-loop" type="button" aria-label="開啟循環播放" aria-pressed="false" title="循環播放">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17 2l3 3-3 3"></path>
                                <path d="M4 11V9a4 4 0 0 1 4-4h12"></path>
                                <path d="M7 22l-3-3 3-3"></path>
                                <path d="M20 13v2a4 4 0 0 1-4 4H4"></path>
                                <path d="M12 9v6"></path>
                                <path d="M10.5 10.5 12 9"></path>
                            </svg>
                        </button>
                        <div class="detail-volume">
                            <button class="detail-volume-toggle" type="button" aria-label="靜音" aria-pressed="false" title="靜音">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M5 9v6h4l5 4V5L9 9H5"></path>
                                    <path class="volume-wave" d="M17 9.5a4 4 0 0 1 0 5"></path>
                                    <path class="volume-wave" d="M19.5 7a7.5 7.5 0 0 1 0 10"></path>
                                    <path class="volume-x" d="m17 9 5 6m0-6-5 6"></path>
                                </svg>
                            </button>
                            <label class="visually-hidden" for="detail-volume">音量</label>
                            <input id="detail-volume" class="detail-volume-slider" type="range" min="0" max="1" value="1" step="0.01">
                        </div>
                        <button class="detail-auto-next" type="button" aria-label="開啟自動下一首" aria-pressed="false" title="自動下一首">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="m5 6 8 6-8 6V6"></path>
                                <path d="m13 6 8 6-8 6V6"></path>
                            </svg>
                        </button>
                    </div>
                    <aside class="detail-playlist-panel" aria-label="NOIRSON 播放清單" hidden>
                        <div class="detail-playlist-header">
                            <div><span data-i18n="detail.playlist">PLAYLIST</span><strong>NOIRSON MIXES</strong></div>
                            <button class="detail-playlist-close" type="button" aria-label="關閉播放清單">×</button>
                        </div>
                        <div class="detail-playlist-list"></div>
                    </aside>
                    <audio id="detail-audio" preload="metadata"></audio>
                </div>

                <p class="music-detail-description" id="detail-description"></p>
                <button class="detail-favorite" type="button" data-i18n="detail.favorite">+ Add to Favorite</button>

                <section class="detail-comments" aria-labelledby="detail-comments-title">
                    <h2 id="detail-comments-title" data-i18n="detail.comments">COMMENTS</h2>
                    <label class="visually-hidden" for="detail-comment">Leave a comment</label>
                    <textarea id="detail-comment" rows="3" placeholder="Leave a comment..." data-i18n-placeholder="detail.comment" disabled></textarea>
                </section>

                <div class="detail-youtube-row">
                    <a class="detail-youtube" id="detail-youtube" href="#" target="_blank" rel="noreferrer"><span data-i18n="detail.youtube">Listen on YouTube</span> <span aria-hidden="true">↗</span></a>
                </div>
            </div>
        </section>

    </main>

    <footer class="site-footer site-footer--v2">
        <nav class="social-links" aria-label="社群連結">

            <a href="https://www.instagram.com/noirson_0?utm_source=ig_web_button_share_sheet&amp;stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2 0 1.8.2 2.2.4.5.2.9.5 1.3.9.4.4.7.8.9 1.3.2.4.4 1 .4 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c0 1.2-.2 1.8-.4 2.2-.2.5-.5.9-.9 1.3-.4.4-.8.7-1.3.9-.4.2-1 .4-2.2.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2 0-1.8-.2-2.2-.4a3.7 3.7 0 0 1-1.3-.9 3.7 3.7 0 0 1-.9-1.3c-.2-.4-.4-1-.4-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c0-1.2.2-1.8.4-2.2.2-.5.5-.9.9-1.3.4-.4.8-.7 1.3-.9.4-.2 1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2ZM12 0C8.7 0 8.3 0 7 .1 5.7.1 4.8.3 4 .6c-.8.3-1.5.7-2.2 1.4C1.1 2.7.7 3.4.4 4.2.1 5 0 5.9 0 7.2 0 8.5 0 8.9 0 12s0 3.5.1 4.8c0 1.3.2 2.2.5 3 .3.8.7 1.5 1.4 2.2.7.7 1.4 1.1 2.2 1.4.8.3 1.7.5 3 .5 1.3.1 1.7.1 4.8.1s3.5 0 4.8-.1c1.3 0 2.2-.2 3-.5.8-.3 1.5-.7 2.2-1.4.7-.7 1.1-1.4 1.4-2.2.3-.8.5-1.7.5-3 .1-1.3.1-1.7.1-4.8s0-3.5-.1-4.8c0-1.3-.2-2.2-.5-3-.3-.8-.7-1.5-1.4-2.2A6 6 0 0 0 19.8.5c-.8-.3-1.7-.5-3-.5C15.5 0 15.1 0 12 0Zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4ZM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm7.9-10.5a1.45 1.45 0 1 1-2.9 0 1.45 1.45 0 0 1 2.9 0Z"/></svg><span>INSTAGRAM</span></a>
        </nav>
        <div class="footer-meta"><span data-i18n="footer.produced">Mixes by NOIRSON</span><span>© NOIRSON</span></div>
    </footer>

    <script src="js/mix-data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
